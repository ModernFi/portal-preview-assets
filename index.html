<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f2f4f7;color:#101828}
header{position:sticky;top:0;background:#fff;padding:12px 20px;box-shadow:0 1px 3px rgba(16,24,40,.08);display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header b{font-size:15px}#q{flex:1;min-width:220px;max-width:380px;padding:8px 12px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}
.seg{display:flex;border:1px solid #d0d5dd;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:13px;cursor:pointer;color:#475467}
.seg button.on{background:#101828;color:#fff}
#count{color:#667085;font-size:13px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px 20px}
a.card{background:#fff;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(16,24,40,.06);position:relative}
a.card img{width:100%;display:block;aspect-ratio:1560/1080;object-fit:cover;background:#eef1f4}
a.card .m{padding:8px 12px}
a.card .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.card .x{font-size:11px;color:#b42318;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.chip{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.chip.ready{background:#12b76a}.chip.review{background:#f79009}.chip.excluded{background:#d92d20}
.chip2{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef4ff;color:#3538cd}

let q='',ft='all',fs='all';
const grid=document.getElementById('grid'),count=document.getElementById('count');
function render(){
  const hits=ITEMS.filter(x=>(ft=='all'||x.t==ft)&&(fs=='all'||x.s==fs)&&x.n.toLowerCase().includes(q));
  count.textContent=hits.length+' of '+ITEMS.length;
  grid.innerHTML=hits.slice(0,1200).map(x=>`<a class="card" href="${x.f}" target="_blank">

    <img loading="lazy" src="${x.f}" alt="${x.n}"><div class="m"><div class="n">${x.n}</div><div class="x">${x.x||''}</div></div></a>`).join('')
    +(hits.length>1200?'<p style="color:#667085">Showing first 1,200 — refine the search.</p>':'');
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();render()});
for(const id of ['ft','fs']) document.getElementById(id).addEventListener('click',e=>{
  if(e.target.tagName!='BUTTON')return;
